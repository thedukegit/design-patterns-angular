<div>
  <mat-form-field>
    <mat-label>-- Choose action --</mat-label>
    <mat-select (selectionChange)="setCommand1($event.value)">
      @for (option of options; track $index) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  &nbsp;
  <app-button [command]="command1" [label]="label1"></app-button>
</div>
